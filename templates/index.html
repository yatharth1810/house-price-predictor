<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>House Price Predictor</title>
  </head>
  <body class="bg-dark">

    <div class="container">
      <div class="row">
        <div class="card" style="width: 100%; height: 100%; margin-top: 50px">
          
          <div class="card-header" style="text-align: center">
            <h1>Welcome to Bangalore House Price Predictor</h1>
          </div>

          <div class="card-body">
            <form method="post" accept-charset="utf-8">

              <!-- Location Dropdown -->
              <div class="row">
                <div class="col-md-6 form-group" style="text-align: center">
                  <label><b>Select Location:</b></label>
                  <select class="selectpicker form-control" id="location" name="location" required="1">
                    {% for location in locations %}
                      <option value="{{ location }}">{{ location }}</option>
                    {% endfor %}
                  </select>
                </div>

                <!-- BHK Input -->
                <div class="col-md-6 form-group" style="text-align: center">
                  <label><b>Enter BHK:</b></label>
                  <input class="form-control" type="text" id="bhk" name="bhk" placeholder="Enter BHK">
                </div>

                <!-- Bathrooms Input -->
                <div class="col-md-6 form-group" style="text-align: center">
                  <label><b>Enter Number of Bathrooms:</b></label>
                  <input class="form-control" type="text" id="bath" name="bath" placeholder="Enter Number of Bathrooms">
                </div>

                <!-- Total Sqft Input -->
                <div class="col-md-6 form-group" style="text-align: center">
                  <label><b>Enter Square Feet:</b></label>
                  <input class="form-control" type="text" id="total_sqft" name="total_sqft" placeholder="Enter Square Feet">
                </div>

                <!-- Submit Button -->
                <div class="col-md-12 form-group">
                  <button class="btn btn-primary form-control" onclick="send_data()">Predict Price</button>
                </div>
              </div>

            </form>
            <br>

            <!-- Output Display -->
            <div class="col-md-12" style="text-align: center">
              <h3><span id="prediction"></span></h3>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript to communicate with Flask -->
    <script>
      function form_handler(event) {
        event.preventDefault(); // Don't submit the form normally
      }

      function send_data() {
        document.querySelector('form').addEventListener("submit", form_handler);

        // Gather the form data
        var fd = new FormData(document.querySelector('form'));

        // Send data using XMLHttpRequest
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/predict', true);
        document.getElementById('prediction').innerHTML = "Wait! Predicting Price.....";

        xhr.onreadystatechange = function() {
          if (xhr.readyState == XMLHttpRequest.DONE) {
            document.getElementById('prediction').innerHTML = "Prediction: ₹ " + xhr.responseText;
          }
        };

        xhr.onload = function() {};
        xhr.send(fd);
      }
    </script>

    <!-- Optional JavaScript; jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
